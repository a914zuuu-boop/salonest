<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SALOWORK</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="header">
  <div class="logo" onclick="showPage('home')">
    <span class="logo-mark">S</span>
    <div>
      <strong>SALOWORK</strong>
      <small>WORKSPACE FOR STYLISTS</small>
    </div>
  </div>

  <nav class="nav-menu">
    <button onclick="showPage('home')"><span>⌂</span>ホーム</button>
    <button onclick="showPage('search')"><span>⌕</span>探す</button>
    <button onclick="showPage('map')"><span>⌖</span>地図</button>
    <button onclick="showPage('favorites')"><span>♡</span>お気に入り</button>
    <button onclick="showPage('mypage')"><span>◌</span>マイページ</button>
  </nav>
</header>

<main>

  <section id="homePage" class="page active">
    <section class="hero">
      <p class="eyebrow">Find your best work destination</p>
      <h1>あなたにぴったりな<br>働き方を見つける。</h1>
      <button onclick="showPage('search')">今すぐ探す</button>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>おすすめサロン</h2>
        <button class="text-btn" onclick="showAllSalons()">すべて見る</button>
      </div>

      <div id="recommendList" class="recommend-list"></div>

      <div class="section-head area-title">
        <h2>人気エリア</h2>
      </div>

      <div id="areaList" class="area-list"></div>
    </section>
  </section>

  <section id="searchPage" class="page">
    <section class="section">
      <div class="section-head">
        <div>
          <p class="eyebrow dark">Search</p>
          <h2>美容室を探す</h2>
        </div>
        <p id="resultCount" class="result-count"></p>
      </div>

      <div class="search-layout">
        <aside class="filter-box">
          <h3>検索条件</h3>

          <label>エリア</label>
          <select id="areaFilter">
            <option value="all">松山市全域</option>
            <option value="大街道">大街道</option>
            <option value="松山市駅">松山市駅</option>
            <option value="道後">道後</option>
            <option value="湊町">湊町</option>
            <option value="久米">久米</option>
          </select>

          <label>料金</label>
          <select id="priceFilter">
            <option value="all">指定なし</option>
            <option value="2500">¥2,500以下</option>
            <option value="3000">¥3,000以下</option>
            <option value="4000">¥4,000以下</option>
          </select>

          <label>設備</label>
          <select id="facilityFilter">
            <option value="all">指定なし</option>
            <option value="シャンプー台">シャンプー台</option>
            <option value="Wi-Fi">Wi-Fi</option>
            <option value="駐車場">駐車場</option>
          </select>

          <button onclick="searchSalons()">条件で検索</button>
        </aside>

        <div id="salonList" class="salon-list"></div>
      </div>
    </section>
  </section>

  <section id="mapPage" class="page">
    <section class="section beige">
      <div class="section-head">
        <div>
          <p class="eyebrow dark">Map Search</p>
          <h2>地図検索</h2>
        </div>
      </div>

      <div class="map-wrapper">
        <iframe
          class="google-map"
          src="https://www.google.com/maps?q=愛媛県松山市大街道&output=embed"
          loading="lazy">
        </iframe>

        <button class="price-pin pin-1" onmouseenter="showMapSalon(1)" onclick="openDetail(1)">¥2,500〜</button>
        <button class="price-pin pin-2" onmouseenter="showMapSalon(2)" onclick="openDetail(2)">¥2,800〜</button>
        <button class="price-pin pin-3" onmouseenter="showMapSalon(3)" onclick="openDetail(3)">¥2,200〜</button>
        <button class="price-pin pin-4" onmouseenter="showMapSalon(4)" onclick="openDetail(4)">¥2,300〜</button>

        <div id="mapPreviewPage" class="map-bottom-card"></div>
      </div>
    </section>
  </section>

  <section id="detailPage" class="page">
    <section id="detailContent" class="section"></section>
  </section>

  <section id="favoritesPage" class="page">
    <section class="section">
      <div class="section-head">
        <h2>お気に入り</h2>
      </div>
      <div id="favoriteList" class="recommend-list"></div>
    </section>
  </section>

  <section id="reservationPage" class="page">
    <section class="section">
      <div class="section-head">
        <h2>予約する</h2>
      </div>
      <div id="reservationContent"></div>
    </section>
  </section>

  <section id="mypagePage" class="page">
    <section class="section">
      <div class="mypage-card">
        <div class="profile">
          <div class="avatar">Y</div>
          <div>
            <h2>Yuki Tanaka</h2>
            <p>Freelance Hair Stylist</p>
          </div>
        </div>

        <div class="menu-grid">
          <div>予約一覧 <span>›</span></div>
          <div>利用履歴 <span>›</span></div>
          <div>お気に入り <span>›</span></div>
          <div>通知設定 <span>›</span></div>
          <div>アカウント設定 <span>›</span></div>
          <div>ヘルプ <span>›</span></div>
        </div>
      </div>
    </section>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
